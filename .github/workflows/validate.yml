name: Validate code and publication contents

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            replication/requirements.txt
            replication/constraints-py311.txt
      - name: Install the constrained environment
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Check formula and date conventions
        run: python -m replication.validate_sample --self-test
      - name: Check ESI and Aqua graph without cloud access
        run: python -m replication.validate_sample --channel-graph-check
      - name: Check production resampling graphs
        run: python -m replication.validate_resampling
      - name: Exercise fire preparation with synthetic fixtures
        run: python -m replication.validate_fire_detections
      - name: Exercise nightlights preparation with synthetic fixtures
        run: python -m replication.validate_nightlights
      - name: Enforce code-only archive and dependency boundaries
        run: python -m replication.validate_release
      - name: Check notebooks and deterministic code archive
        shell: python
        run: |
          import ast
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          from replication.build_release import build_release, collect_release_files

          forbidden_suffixes = {
              ".csv", ".tsv", ".dta", ".parquet", ".feather", ".arrow",
              ".h5", ".hdf", ".hdf5", ".nc", ".nc4", ".tif", ".tiff",
              ".geojson", ".gpkg", ".shp", ".shx", ".dbf", ".prj", ".cpg",
              ".pem", ".key", ".p12", ".pfx", ".zip", ".7z", ".tar", ".gz",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          for name in filter(None, tracked):
              path = Path(name)
              assert path.suffix.lower() not in forbidden_suffixes, name
              assert path.name == ".env.example" or not path.name.startswith(".env"), name
              assert not {"datasets", "inputs", "outputs", "release_outputs", ".task_tmp", ".venv"}.intersection(path.parts), name
          source = Path("replication")
          for relative in collect_release_files(source):
              if relative.suffix == ".py":
                  ast.parse((source / relative).read_text(encoding="utf-8"))
          for path in Path(".").glob("*.ipynb"):
              notebook = json.loads(path.read_text(encoding="utf-8"))
              assert "widgets" not in notebook.get("metadata", {}), path
              for cell in notebook["cells"]:
                  if cell["cell_type"] == "code":
                      assert not cell.get("outputs"), path
                      assert cell.get("execution_count") is None, path
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              first = build_release(source, root / "first.zip")
              second = build_release(source, root / "second.zip")
              assert first["archive_sha256"] == second["archive_sha256"]
              print(json.dumps({"members": first["member_count"], "sha256": first["archive_sha256"]}))

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan checked-out files and full fetched history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner
